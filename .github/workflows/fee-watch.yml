# Reads the loaded Rest of New York files once a day.
# It does not download a new fee schedule and it does not submit a claim.
name: Fee file watch

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/fee-watch.mjs
