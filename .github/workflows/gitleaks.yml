# Secret scan on every push and pull request: the full git history and the checked-out tree.
# Uses the pinned gitleaks release binary (checksum verified), not a third-party action, and needs no license or token.
name: Secret scan (gitleaks)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version
      - name: Scan full history
        run: ./gitleaks git . --redact --no-banner --exit-code 1
      - name: Scan the working tree
        run: ./gitleaks dir . --redact --no-banner --exit-code 1
